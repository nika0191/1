[project]
name = "lumean-tts"
version = "0.1.0"
description = "Client and CLI for the Lumean text-to-speech public API"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
lumean = "lumean.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lumean"]
